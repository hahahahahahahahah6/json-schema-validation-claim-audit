[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "json-schema-validation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
json-schema-validation-claim-audit = "json_schema_validation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["json_schema_validation_claim_audit*", "tests"]
